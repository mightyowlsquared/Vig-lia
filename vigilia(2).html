<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="theme-color" content="#0b1017">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">
<title>Vigília · Monitoramento climático do Brasil</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<style>
:root{--bg:#0b1017;--sf:#121a24;--sf2:#18222f;--st:#26313d;--mu:#8291a5;--tx:#edf3f7;--ac:#58e0b0;--warn:#ff9f43;--err:#ff6b6b}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:14px/1.4 Inter,-apple-system,"Segoe UI",sans-serif;overflow:hidden;overscroll-behavior:none;-webkit-text-size-adjust:100%;text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
button,input{font:inherit;color:inherit;touch-action:manipulation}
:root{--hh:56px;--navh:0px}
#app{display:grid;grid-template-columns:350px 1fr;grid-template-rows:56px 1fr;height:100%;height:100vh;height:100dvh;position:relative}
header{grid-column:1/3;display:flex;align-items:center;gap:12px;padding:0 16px;border-bottom:1px solid var(--st);background:var(--bg)}
header b{font-size:19px;letter-spacing:-.02em}header small{color:var(--mu);letter-spacing:.12em;font-size:10px;text-transform:uppercase}
header .sp{flex:1}#menu{display:none}
.btn{border:1px solid var(--st);background:var(--sf);border-radius:999px;padding:7px 13px;cursor:pointer;font-size:12px}
.btn:hover{border-color:var(--ac)}.btn.on{border-color:var(--ac);color:var(--ac)}
aside{background:var(--sf);border-right:1px solid var(--st);display:flex;flex-direction:column;min-height:0;z-index:600}
.sbtop{padding:14px;border-bottom:1px solid var(--st)}
#q{width:100%;-webkit-appearance:none;appearance:none;background:var(--bg);border:1px solid var(--st);border-radius:10px;padding:10px 12px;outline:none}#q:focus{border-color:var(--ac)}
.tabs{display:flex;gap:6px;margin-top:10px}
.sbbody{overflow:auto;padding:14px;flex:1}
.card{background:var(--sf2);border:1px solid var(--st);border-radius:12px;padding:12px;margin-bottom:10px}
.mu{color:var(--mu);font-size:12px}.big{font-size:32px;font-weight:700;letter-spacing:-.03em}
.item{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--st);padding:8px 2px;cursor:pointer}
.item:hover{color:var(--ac)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;background:var(--mu)}
.dot.ok{background:var(--ac)}.dot.err{background:var(--err)}.dot.loading{background:var(--warn)}
a{color:var(--ac)}
.fc{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:8px;text-align:center;font-size:11px}
.fc div{background:var(--bg);border-radius:8px;padding:6px 2px}
#mapwrap{position:relative;min-height:0}#map{position:absolute;inset:0;background:#0a121d}
.leaflet-container{font-family:inherit}
.leaflet-control-attribution{background:rgba(11,16,23,.8)!important;color:var(--mu)!important}.leaflet-control-attribution a{color:var(--mu)!important}
.slabel{background:none;border:0;box-shadow:none;color:#c4d0de;font-size:11px;font-weight:600;text-shadow:0 0 3px #000,0 0 3px #000;padding:0}
.slabel:before{display:none}.lowz .slabel{display:none}
.mlabel span{position:absolute;transform:translate(-50%,-50%);white-space:nowrap;color:#cfdbe8;font-weight:500;letter-spacing:.01em;text-shadow:0 0 3px #000,0 0 3px #000,0 0 5px #000;pointer-events:none}
#hover{position:absolute;z-index:700;pointer-events:none;width:270px;background:rgba(18,26,36,.96);border:1px solid var(--st);border-radius:12px;padding:12px;box-shadow:0 8px 28px rgba(0,0,0,.5);display:none;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
#hover h4{margin:0 0 2px;font-size:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:2px 10px;font-size:12px;margin-top:6px}
.fab{position:absolute;z-index:650;display:grid;gap:8px}
#zoom{right:14px;bottom:30px}#zoom .btn{width:40px;height:40px;padding:0;font-size:18px;border-radius:12px}
#layers{left:14px;bottom:30px;display:flex;flex-direction:column;align-items:flex-start;gap:8px}
#lmenu{display:none;width:270px;background:var(--sf);border:1px solid var(--st);border-radius:14px;padding:12px}
#lmenu.open{display:block}
.bases{display:flex;gap:8px}.base{flex:1;text-align:center;font-size:11px;cursor:pointer;color:var(--mu)}
.base i{display:block;height:46px;border-radius:10px;border:2px solid var(--st);margin-bottom:3px}
.base.on{color:var(--ac)}.base.on i{border-color:var(--ac)}
.lmenu-sec{font-size:11px;color:var(--mu);text-transform:uppercase;letter-spacing:.1em;margin:12px 0 4px}
#lmenu label{display:flex;align-items:center;gap:8px;padding:4px 0;cursor:pointer;font-size:13px}
#lmenu input{accent-color:var(--ac)}
#legend{position:absolute;top:12px;left:12px;z-index:650;display:flex;gap:6px;flex-wrap:wrap;max-width:60%}
#toast{position:absolute;z-index:800;top:12px;left:50%;transform:translateX(-50%);background:var(--sf);border:1px solid var(--st);border-radius:10px;padding:8px 14px;font-size:12px;display:none}
.plabel span{position:absolute;transform:translate(-50%,-50%);white-space:nowrap;color:#9fe8cf;font-style:italic;font-size:12px;text-shadow:0 0 3px #000,0 0 3px #000,0 0 5px #000;pointer-events:none}
.plabel-a span{color:#ffe29a;font-style:normal;font-weight:600}
.pop b{display:block}
#grab,#nav,#peek{display:none}
@keyframes spin{to{transform:rotate(360deg)}}
.busy .ri{display:inline-block;animation:spin .8s linear infinite}
#refresh:disabled{opacity:.75;cursor:progress}
#upd{font-size:11px;white-space:nowrap}
.pk-l{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pk-t{font-size:20px;font-weight:700;white-space:nowrap}
@media(max-width:900px){
:root{--hh:52px;--navh:calc(58px + env(safe-area-inset-bottom,0px))}
#app{grid-template-columns:1fr;grid-template-rows:calc(var(--hh) + env(safe-area-inset-top,0px)) minmax(0,1fr) var(--navh)}
header{grid-column:1;gap:8px;padding:env(safe-area-inset-top,0px) calc(10px + env(safe-area-inset-right,0px)) 0 calc(10px + env(safe-area-inset-left,0px))}
header small,#clock,#abadge,.rt{display:none!important}
header b{font-size:18px}
#upd{font-size:10px;line-height:1.15;text-align:right;white-space:normal;max-width:90px}
#refresh{width:44px;height:40px;padding:0;font-size:19px;border-radius:12px}
#nav{display:flex;grid-row:3;background:var(--sf);border-top:1px solid var(--st);padding-bottom:env(safe-area-inset-bottom,0px);z-index:800}
.nb{flex:1;position:relative;background:none;border:0;color:var(--mu);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;cursor:pointer}
.nb span{font-size:19px;line-height:1}.nb.on{color:var(--ac)}
.nb em{position:absolute;top:5px;left:calc(50% + 6px);background:var(--warn);color:#111;border-radius:9px;font-style:normal;font-size:10px;font-weight:700;padding:0 5px;min-width:16px;line-height:16px;text-align:center}
aside{position:absolute;left:0;right:0;bottom:var(--navh);width:auto;height:60vh;height:60dvh;border-right:0;border-top:1px solid var(--st);border-radius:18px 18px 0 0;transform:translateY(110%);visibility:hidden;transition:transform .25s ease,height .25s ease,visibility 0s linear .25s;box-shadow:0 -10px 30px rgba(0,0,0,.45);z-index:700}
aside.open{transform:none;visibility:visible;transition-delay:0s}
aside.tall{height:calc(100vh - var(--hh) - var(--navh) - 44px);height:calc(100dvh - var(--hh) - env(safe-area-inset-top,0px) - var(--navh) - 44px)}
#grab{display:flex;align-items:center;justify-content:center;position:relative;height:30px;flex:none;touch-action:none}
#grab i{width:40px;height:4px;border-radius:2px;background:var(--st)}
#sclose{position:absolute;right:8px;top:2px;width:34px;height:26px;min-height:0;padding:0;font-size:12px;border-radius:9px}
.tabs{display:none}.sbtop{padding:0 14px 12px}
#q{font-size:16px;padding:12px}
.sbbody{padding:12px 14px calc(14px + env(safe-area-inset-bottom,0px));-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.item{padding:12px 2px}
button.btn{min-height:40px}
#peek{display:flex;position:absolute;z-index:660;top:10px;left:10px;right:10px;align-items:center;gap:10px;background:rgba(18,26,36,.96);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);border:1px solid var(--st);border-radius:14px;padding:10px 12px;cursor:pointer;box-shadow:0 6px 20px rgba(0,0,0,.4)}
#peek>div:first-child{flex:1;min-width:0}
body.sheet #peek{display:none}
#lbtn{display:none}
#layers{left:10px;bottom:12px}
#lmenu{width:min(88vw,320px);max-height:calc(100vh - var(--hh) - var(--navh) - 40px);max-height:calc(100dvh - var(--hh) - env(safe-area-inset-top,0px) - var(--navh) - 40px);overflow:auto;-webkit-overflow-scrolling:touch}
#lmenu label{padding:9px 0}#lmenu input{width:20px;height:20px}
#zoom{right:10px;bottom:12px}#zoom .btn{width:42px;height:42px}
#legend{top:72px;left:10px;right:10px;max-width:none;flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;pointer-events:auto}
#legend .btn{white-space:nowrap;padding:4px 10px;font-size:11px;flex:none}
#toast{top:76px;bottom:auto;left:10px;right:10px;transform:none;max-width:none}
#hover{width:230px}
}
@media(max-width:900px) and (max-height:500px){
:root{--hh:44px;--navh:calc(44px + env(safe-area-inset-bottom,0px))}
.nb{flex-direction:row;gap:6px}.nb em{position:static}
#peek{right:auto;max-width:60%}#legend{top:64px}
}
</style>
</head>
<body>
<div id="app">
<header>
 <svg width="26" height="26" viewBox="0 0 26 26"><polygon points="13,2 24,8 24,18 13,24 2,18 2,8" fill="none" stroke="#58e0b0" stroke-width="2"/><circle cx="13" cy="13" r="3.5" fill="#58e0b0"/></svg>
 <div><b>Vigília</b><br><small>Monitoramento climático · Brasil</small></div>
 <span class="sp"></span>
 <span class="mu" id="upd" title="Última atualização dos dados"></span>
 <span class="mu" id="clock"></span>
 <button class="btn" id="abadge" style="display:none;color:var(--warn)">⚠</button>
 <button class="btn" id="refresh" aria-label="Atualizar dados"><span class="ri">↻</span><span class="rt"> Atualizar</span></button>
</header>
<aside id="side">
 <div id="grab"><i></i><button class="btn" id="sclose" aria-label="Fechar painel">✕</button></div>
 <div class="sbtop">
  <input id="q" placeholder="Município, estado ou bairro (Enter)…" autocomplete="off" enterkeyhint="search" autocapitalize="off" spellcheck="false">
  <div class="tabs">
   <button class="btn on" data-tab="explorar">Explorar</button>
   <button class="btn" data-tab="alertas">Alertas</button>
   <button class="btn" data-tab="fontes">Fontes</button>
  </div>
 </div>
 <div class="sbbody" id="sbbody"></div>
</aside>
<div id="mapwrap">
 <div id="map"></div>
 <div id="toast"></div>
 <div id="peek" role="button" aria-label="Abrir detalhes do local"></div>
 <div id="legend"></div>
 <div id="hover"></div>
 <div class="fab" id="layers">
  <div id="lmenu">
   <div class="bases">
    <div class="base on" data-base="dark"><i style="background:#1a2330"></i>Escuro</div>
    <div class="base" data-base="sat"><i style="background:linear-gradient(135deg,#2d4a2b,#4a6b8a)"></i>Satélite</div>
    <div class="base" data-base="topo"><i style="background:linear-gradient(135deg,#8a7a56,#5d8a5a)"></i>Relevo</div>
   </div>
   <div class="lmenu-sec">Limites</div>
   <label><input type="checkbox" data-ov="states" checked> Estados</label>
   <label><input type="checkbox" data-ov="munis" checked> Municípios e nomes (zoom ≥ 7)</label>
   <label><input type="checkbox" data-ov="places" checked> Bairros e localidades (OSM, zoom ≥ 9)</label>
   <div class="lmenu-sec">Tempo real</div>
   <label><input type="checkbox" data-ov="radar"> Radar de chuva (RainViewer)</label>
   <label><input type="checkbox" data-ov="fire"> Focos de calor (NASA VIIRS)</label>
   <label><input type="checkbox" data-ov="eonet" checked> Eventos NASA EONET</label>
   <label><input type="checkbox" data-ov="quake"> Sismos (USGS, 7 dias)</label>
   <label><input type="checkbox" data-ov="risk" checked> Risco de tempestade/vento (modelo 24 h)</label>
  </div>
  <button class="btn" id="lbtn">⧉ Camadas</button>
 </div>
 <div class="fab" id="zoom">
  <button class="btn" id="loc" title="Minha localização">◎</button>
  <button class="btn" id="zin">+</button>
  <button class="btn" id="zout">−</button>
  <button class="btn" id="zbr" style="font-size:11px">BR</button>
 </div>
</div>
<nav id="nav" aria-label="Navegação">
 <button class="nb" data-go="explorar"><span>🔍</span>Explorar</button>
 <button class="nb" data-go="alertas"><span>⚠️</span>Alertas<em id="nbadge" style="display:none"></em></button>
 <button class="nb" data-go="camadas"><span>⧉</span>Camadas</button>
 <button class="nb" data-go="fontes"><span>ℹ️</span>Fontes</button>
</nav>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script>
(function(){
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const TOUCH=matchMedia('(hover:none)').matches,isM=()=>innerWidth<=900;
const IBGE='https://servicodados.ibge.gov.br/api/';
const BR=[-14.235,-51.925];
const fmt=v=>{if(!v)return'—';const d=new Date(v);return isNaN(d)?v:d.toLocaleString('pt-BR')};
const WMO={0:'Céu limpo',1:'Predominantemente limpo',2:'Parcialmente nublado',3:'Nublado',45:'Névoa',48:'Névoa com gelo',51:'Garoa fraca',53:'Garoa moderada',55:'Garoa densa',56:'Garoa congelante',57:'Garoa congelante forte',61:'Chuva fraca',63:'Chuva moderada',65:'Chuva forte',66:'Chuva congelante',67:'Chuva congelante forte',71:'Neve fraca',73:'Neve moderada',75:'Neve forte',77:'Grãos de neve',80:'Pancadas fracas',81:'Pancadas moderadas',82:'Pancadas fortes',85:'Neve em pancadas',86:'Neve forte em pancadas',95:'Trovoada',96:'Trovoada com granizo',99:'Trovoada com granizo forte'};
const ICON=c=>c==null?'·':c===0?'☀️':c<3?'⛅':c==3?'☁️':c<50?'🌫️':c<60?'🌦️':c<70?'🌧️':c<80?'❄️':c<90?'🌧️':'⛈️';
const aqiLbl=v=>v==null?'—':v<=50?'Boa':v<=100?'Moderada':v<=150?'Ruim p/ sensíveis':v<=200?'Ruim':v<=300?'Muito ruim':'Perigosa';

/* ---------- estado ---------- */
const S={states:{},munis:{},stateBounds:{},hoverName:null,sel:{label:'Brasília, DF',lat:-15.7939,lon:-47.8828},selWx:null,mLabels:[],tab:'explorar',evs:[],inmet:[],quakes:[],
 src:{ibge:['IBGE · malhas e localidades',0,0,'https://www.ibge.gov.br/'],meteo:['Open-Meteo · tempo e qualidade do ar',0,0,'https://open-meteo.com/'],risk:['Open-Meteo · risco de tempestade/vento (modelo)',0,0,'https://open-meteo.com/en/docs'],osm:['OpenStreetMap · bairros e localidades (Overpass/Nominatim)',0,0,'https://www.openstreetmap.org/'],rain:['RainViewer · radar',0,0,'https://www.rainviewer.com/'],eonet:['NASA EONET · eventos naturais',0,0,'https://eonet.gsfc.nasa.gov/'],inmet:['INMET · avisos ativos',0,0,'https://avisos.inmet.gov.br/'],usgs:['USGS · sismos',0,0,'https://earthquake.usgs.gov/earthquakes/map/'],fire:['NASA GIBS · focos de calor VIIRS',0,0,'https://worldview.earthdata.nasa.gov/'],met:['MET Norway · clima (contingência)',0,0,'https://api.met.no/']}};
S.risk=[];S.openCap=new Set();S.geo=null;S.places=new Map();
Object.values(S.src).forEach(a=>{a[1]='idle';a[2]=null});
function setSrc(k,st){S.src[k][1]=st;if(st==='ok')S.src[k][2]=new Date().toISOString();if(S.tab==='fontes')render()}
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',4000)}
async function J(u,sig,fresh){const r=await fetch(u,fresh?{signal:sig,cache:'no-store'}:{signal:sig});if(!r.ok)throw new Error('HTTP '+r.status);return r.json()}

/* ---------- mapa ---------- */
const map=L.map('map',{zoomControl:false,minZoom:3,maxZoom:18,worldCopyJump:false,zoomSnap:.25,zoomDelta:1,wheelPxPerZoomLevel:90,wheelDebounceTime:30,inertia:true,tapTolerance:15}).setView(BR,4);
const bases={
 dark:L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',{subdomains:'abcd',attribution:'© OSM © CARTO'}),
 sat:L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{attribution:'Esri'}),
 topo:L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png',{subdomains:'abc',maxZoom:17,attribution:'© OpenTopoMap'})};
let base='dark';bases.dark.addTo(map);
const ov={states:L.layerGroup(),munis:L.layerGroup(),mlabels:L.layerGroup(),radar:null,fire:null,eonet:L.layerGroup(),quake:L.layerGroup(),places:L.layerGroup(),risk:L.layerGroup()};let muniRects=[];map.createPane('riskp').style.zIndex=450;
L.Popup.prototype.options.maxWidth=Math.min(300,innerWidth-70);L.Popup.prototype.options.autoPanPaddingTopLeft=[10,isM()?80:10];
map.attributionControl.setPrefix('Vigília · IBGE · Open-Meteo · NASA · INMET · © OpenStreetMap');
const lowz=()=>$('#map').classList.toggle('lowz',map.getZoom()>5);
map.on('zoomstart',()=>ov.mlabels.clearLayers());map.on('zoomend',()=>{lowz();loadMunis();updateLabels();loadPlaces()});map.on('moveend',()=>{loadMunis();updateLabels();loadPlaces()});lowz();ov.munis.addTo(map);ov.mlabels.addTo(map);ov.places.addTo(map);ov.risk.addTo(map);

/* ---------- clima ---------- */
const cache=new Map(),inflight=new Map();let omBlock=0;
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
/* fetch com novas tentativas (rede/5xx); 429 não insiste e aciona a fonte de contingência */
async function JR(u,sig,tries=3){
 let err;
 for(let i=0;i<tries;i++){
  try{return await J(u,sig,true)}
  catch(e){
   if(sig&&sig.aborted)throw e;
   const m=/HTTP (\d+)/.exec(e.message||''),code=m?+m[1]:0;
   err=(e.name==='TypeError')?new Error('falha de rede (sem conexão, bloqueio ou CORS)'):e;
   if(code===429&&/open-meteo/.test(u))omBlock=Date.now()+30000;
   if(code&&code<500&&code!==408)break;
   if(i<tries-1)await sleep(600*(i+1));
  }
 }
 throw err;
}
async function wxOpenMeteo(lat,lon,sig){
 if(Date.now()<omBlock)throw new Error('limite de requisições atingido (tentando de novo em ~'+Math.ceil((omBlock-Date.now())/1000)+' s)');
 const base=`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&timezone=auto&forecast_days=7&forecast_hours=24`,
  cur='temperature_2m,apparent_temperature,relative_humidity_2m,precipitation,wind_speed_10m,wind_gusts_10m,weather_code,pressure_msl',
  dly='weather_code,temperature_2m_max,temperature_2m_min,precipitation_sum,precipitation_probability_max';
 let w;
 try{w=await JR(`${base}&current=${cur}&daily=${dly}&hourly=wind_gusts_10m,precipitation,cape,weather_code`,sig,2)}
 catch(e){if(sig&&sig.aborted||Date.now()<omBlock)throw e;w=await JR(`${base}&current=${cur}&daily=${dly}&hourly=wind_gusts_10m,precipitation,weather_code`,sig,2)}
 if(!w||!w.current||w.current.temperature_2m==null)throw new Error('resposta sem condições atuais');
 const t=w.current.time||'',off=(w.utc_offset_seconds||0)*1000;
 return{w:w.current,h:Object.assign(w.hourly||{},{src:'Open-Meteo'}),daily:w.daily,t0:t?Date.parse((t.length===16?t+':00':t)+'Z')-off:Date.now(),src:'Open-Meteo'};
}
function symToWmo(s){s=(s||'').replace(/_(day|night|polartwilight)$/,'');
 if(/thunder/.test(s))return 95;
 const sh=/showers/.test(s),hv=/heavy/.test(s),lt=/light/.test(s);
 if(/sleet/.test(s))return hv?67:66;
 if(/snow/.test(s))return hv?75:lt?71:73;

 }else if(S.tab==='alertas'){
  let h=riskCard()+`<div class="card"><b>Avisos INMET (oficial)</b> <span class="mu">(${S.inmet.length})</span>${S.src.inmet[1]==='err'?'<div class="mu" style="color:var(--warn)">API do INMET indisponível/bloqueada (CORS). Consulte <a href="https://avisos.inmet.gov.br/" target="_blank" rel="noopener">avisos.inmet.gov.br</a>.</div>':''}`+
   [...S.inmet].sort((x,y)=>mine(y)-mine(x)).slice(0,40).map(a=>{const c=capC[a.id];return `<details data-cap="${esc(a.id)}" style="border-top:1px solid var(--st);padding:6px 0" ${S.openCap.has(a.id)?'open':''}><summary style="cursor:pointer"><b>${mine(a)?'📍 ':''}${c?`<span class="dot" style="background:${esc(c.color||'#888')}"></span>${esc(c.event)} · `:''}${esc(a.t)}</b><br><span class="mu">${esc(c?(SEVPT[c.sev]||c.sev)+' · ':a.sev?a.sev+' · ':'')}${esc(a.est)}<br>${fmt(c?c.onset:a.ini)} → ${fmt(c?c.exp:a.fim)}</span></summary><div class="capb">${c?capHtml(c):capE.has(a.id)||!a.id?'<span class="mu">Detalhes indisponíveis aqui (bloqueio de CORS).</span>':'<span class="mu">Carregando detalhes…</span>'}</div><a href="${esc(a.link)}" target="_blank" rel="noopener">Ver aviso no INMET</a></details>`}).join('')+'</div>';
  h+=`<div class="card"><b>Eventos NASA EONET no Brasil</b> <span class="mu">(${S.evs.length})</span>`+(S.evs.length?S.evs.map(e=>`<button class="item" data-ev="${esc(e.id)}"><span class="dot" style="background:${CAT[e.cid]||'#58e0b0'}"></span>${esc(e.title)}<br><span class="mu">${esc(e.cat)} · ${fmt(e.date)}</span></button>`).join(''):'<div class="mu">Nenhum evento aberto no momento.</div>')+'</div>';
  h+=`<div class="card"><b>Sismos (USGS, 7 dias)</b> <span class="mu">(${S.quakes.length})</span>${S.quakes.length?S.quakes.map(q=>`<div class="mu">M ${q.m} · ${esc(q.p)} · ${fmt(q.t)}</div>`).join(''):'<div class="mu">Nenhum sismo registrado/ativar camada.</div>'}</div>`;
  el.innerHTML=h;
  el.querySelectorAll('details[data-cap]').forEach(d=>d.ontoggle=async()=>{const id=d.dataset.cap;d.open?S.openCap.add(id):S.openCap.delete(id);if(d.open&&id&&!capC[id]&&!capE.has(id)){await loadCap(id).catch(()=>{});render()}});
  el.querySelectorAll('[data-rk]').forEach(b=>b.onclick=()=>{closeSheetM();const r=S.risk[b.dataset.rk];map.flyTo([r.lat,r.lon],9);select(`${r.n}, ${r.uf}`,r.lat,r.lon)});
  el.querySelectorAll('[data-ev]').forEach(b=>b.onclick=()=>{const e=S.evs.find(x=>x.id===b.dataset.ev);closeSheetM();map.flyTo([e.lat,e.lon],8)});
 }else{
  const st={ok:'Conectado',err:'Erro',loading:'Carregando',idle:'Inativo'};
  let h='<div class="card"><b>Disponibilidade das fontes</b>'+Object.values(S.src).map(([n,s,t,u])=>`<div style="margin-top:8px"><span class="dot ${s}"></span><a href="${esc(u)}" target="_blank" rel="noopener">${esc(n)}</a><br><span class="mu" style="margin-left:14px">${st[s]}${t?' · '+fmt(t):''}</span></div>`).join('')+'</div>';
  h+=`<div class="card"><b>Fontes oficiais de monitoramento (consulta externa)</b>
  ${OFICIAIS.map(([n,u])=>`<div style="margin-top:6px"><a href="${u}" target="_blank" rel="noopener">${n}</a></div>`).join('')}
  <div class="mu" style="font-size:11px;margin-top:8px">CEMADEN, INPE e Defesa Civil não oferecem API aberta com CORS para navegador; por isso aparecem como links. Dados geográficos: IBGE. Estimativas de modelo não substituem alertas oficiais.</div></div>`;
  el.innerHTML=h;
 }
}

/* ---------- controles ---------- */
$('#zin').onclick=()=>map.zoomIn();$('#zout').onclick=()=>map.zoomOut();$('#zbr').onclick=()=>map.setView(BR,4);
$('#loc').onclick=()=>{if(!navigator.geolocation)return toast('Geolocalização não suportada.');toast('Obtendo sua localização…');navigator.geolocation.getCurrentPosition(p=>{closeSheetM();map.setView([p.coords.latitude,p.coords.longitude],10);select('Minha localização',p.coords.latitude,p.coords.longitude)},()=>toast('Não foi possível obter a localização (permissão negada ou indisponível).'),{enableHighAccuracy:false,timeout:12000,maximumAge:60000})};
$('#refresh').onclick=()=>refreshAll();
setInterval(()=>$('#clock').textContent=new Date().toLocaleString('pt-BR'),1000);

/* ---------- atualização em tempo real ---------- */
let refreshing=false,lastUpd=0;
function markUpd(){lastUpd=Date.now();$('#upd').textContent='Atualizado '+new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}
async function refreshAll(silent){
 if(refreshing)return;refreshing=true;
 const b=$('#refresh');b.classList.add('busy');b.disabled=true;
 if(silent!==true)toast('Atualizando dados em tempo real…');
 for(const v of cache.values())v.t=Math.min(v.t,Date.now()-3e5);for(const k in capC)delete capC[k];capE.clear();
 const t=[loadEonet(),loadRisk(),loadInmet()];
 if(ov.radar||$('[data-ov=radar]').checked)t.push(loadRadar());
 if($('[data-ov=quake]').checked||S.src.usgs[1]!=='idle')t.push(loadQuakes());
 if(ov.fire){const on=map.hasLayer(ov.fire);map.removeLayer(ov.fire);fireLayer();if(on)ov.fire.addTo(map)}
 if(S.src.ibge[1]==='err')t.push(loadStates());
 if(!Object.keys(S.munis).length)t.push(loadMuniList());
 t.push(getWx(S.sel.lat,S.sel.lon,undefined,true).then(d=>{S.selWx=d;S.selErr=null;render()}).catch(e=>{if(S.selWx)toast('Não foi possível atualizar o clima do local.');else{S.selErr='Não foi possível atualizar as condições atuais.';S.selDet=e.message||String(e)}render()}));
 await Promise.allSettled(t);
 markUpd();
 const bad=['meteo','risk','eonet','inmet','rain','usgs'].filter(k=>S.src[k][1]==='err').map(k=>S.src[k][0].split(' · ')[0]);
 b.classList.remove('busy');b.disabled=false;refreshing=false;
 if(bad.length)toast('Atualizado, mas sem resposta de: '+bad.join(', ')+'.');
 else if(silent!==true)toast('Dados atualizados às '+new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})+'.');
}
setInterval(()=>{if(!document.hidden)refreshAll(true)},2*60*1000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&Date.now()-lastUpd>2*60*1000)refreshAll(true)});
addEventListener('online',()=>refreshAll(true));

/* ---------- navegação mobile: painel deslizante, barra inferior e cartão rápido ---------- */
const sideEl=$('#side');
function sheetOpen(){return sideEl.classList.contains('open')}
function navSync(){$$('.nb').forEach(b=>{const g=b.dataset.go;b.classList.toggle('on',g==='camadas'?$('#lmenu').classList.contains('open'):(sheetOpen()&&S.tab===g))})}
function openSheet(tab){if(tab){S.tab=tab;tabs()}$('#lmenu').classList.remove('open');sideEl.classList.add('open');document.body.classList.add('sheet');render();navSync()}
function closeSheet(){sideEl.classList.remove('open','tall');sideEl.style.transform='';sideEl.style.transition='';document.body.classList.remove('sheet');if(document.activeElement&&document.activeElement.blur)document.activeElement.blur();navSync()}
function closeSheetM(){if(isM())closeSheet()}
$$('.nb').forEach(b=>b.onclick=()=>{const g=b.dataset.go;
 if(g==='camadas'){closeSheet();$('#lmenu').classList.toggle('open');navSync();return}
 if(sheetOpen()&&S.tab===g){closeSheet();return}
 openSheet(g)});
$('#sclose').onclick=closeSheet;
$('#q').onfocus=()=>{if(isM()&&sheetOpen())sideEl.classList.add('tall')};
(function(){const g=$('#grab');let y0=null,dy=0;
 g.addEventListener('touchstart',e=>{if(e.target.closest('#sclose'))return;y0=e.touches[0].clientY;dy=0;sideEl.style.transition='none'},{passive:true});
 g.addEventListener('touchmove',e=>{if(y0==null)return;dy=e.touches[0].clientY-y0;if(dy>0)sideEl.style.transform='translateY('+dy+'px)'},{passive:true});
 g.addEventListener('touchend',()=>{if(y0==null)return;sideEl.style.transition='';sideEl.style.transform='';
  if(dy>90){sideEl.classList.contains('tall')?sideEl.classList.remove('tall'):closeSheet()}
  else if(dy<-50)sideEl.classList.add('tall');
  else if(Math.abs(dy)<8)sideEl.classList.toggle('tall');
  y0=null});
})();
function drawPeek(){
 const e=$('#peek');if(!e)return;const w=S.selWx;let t='<span class="mu">…</span>',sub='<span class="mu">Carregando condições…</span>';
 if(w){const c=w.w,r=riskOf(w.h);t=`${ICON(c.weather_code)} ${c.temperature_2m??'—'}°C`;sub=`<span class="mu">${esc(WMO[c.weather_code]||'')}</span>${r&&r.l>0?` <b style="color:${RC[r.l]};font-size:12px">· ${RL[r.l]}</b>`:''}`}
 else if(S.selErr)sub=`<span style="color:var(--warn);font-size:12px">${esc(S.selErr)}</span>`;
 e.innerHTML=`<div><div class="pk-l">📍 ${esc(S.sel.label)}</div><div>${sub}</div></div><div class="pk-t">${t}</div><span class="mu">›</span>`}
$('#peek').onclick=()=>openSheet('explorar');
/* toque em área sem polígono: seleciona o ponto; toque no mapa fecha menu de camadas */
map.on('click',e=>{
 if(!isM())return;
 if($('#lmenu').classList.contains('open')){$('#lmenu').classList.remove('open');navSync()}
 const t=e.originalEvent&&e.originalEvent.target;if(t&&t.closest&&t.closest('.leaflet-interactive'))return;
 const {lat,lng}=e.latlng;
 placeAt(lat,lng).then(p=>{if(p.out){toast('Fora do território brasileiro.');return}select(p.name,lat,lng)}).catch(()=>select(lat.toFixed(3)+', '+lng.toFixed(3),lat,lng))});
if(window.ResizeObserver)new ResizeObserver(()=>map.invalidateSize()).observe($('#map'));
addEventListener('orientationchange',()=>setTimeout(()=>map.invalidateSize(),300));

/* ---------- init ---------- */
loadStates();loadMuniList();Promise.allSettled([loadInmet(),loadRisk()]).then(markUpd);select('Brasília, DF',-15.7939,-47.8828);
})();
</script>
</body>
</html>
